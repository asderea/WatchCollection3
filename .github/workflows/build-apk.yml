name: Build Watch Collection APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # GitHub 저장소 가져오기
      - name: Checkout repository
        uses: actions/checkout@v6

      # Android 빌드용 Java 17 설치
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # Android SDK 준비
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      # Android API 36 및 Build Tools 설치
      - name: Install Android SDK 36
        run: |
          sdkmanager "platforms;android-36"
          sdkmanager "build-tools;36.0.0"

      # Gradle 8.13 설치
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'

      # 실제 Android 프로젝트 경로 자동 검색
      - name: Find Android project
        id: project
        shell: bash
        run: |
          echo "===== Repository root ====="
          ls -la

          SETTINGS_FILE=$(find . -maxdepth 5 -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            | head -n 1)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "Android Gradle project를 찾지 못했습니다."
            find . -maxdepth 5 -type f | sort
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")
          PROJECT_DIR=${PROJECT_DIR#./}

          if [ -z "$PROJECT_DIR" ]; then
            PROJECT_DIR="."
          fi

          echo "Gradle project directory: $PROJECT_DIR"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

          test -f "$PROJECT_DIR/settings.gradle" \
            -o -f "$PROJECT_DIR/settings.gradle.kts"

          test -f "$PROJECT_DIR/build.gradle" \
            -o -f "$PROJECT_DIR/build.gradle.kts"

          test -f "$PROJECT_DIR/app/build.gradle" \
            -o -f "$PROJECT_DIR/app/build.gradle.kts"

      # ML Kit에 필요한 AndroidX 설정 확인 및 자동 추가
      - name: Ensure AndroidX settings
        shell: bash
        run: |
          PROJECT_DIR="${{ steps.project.outputs.project_dir }}"
          PROPERTIES_FILE="$PROJECT_DIR/gradle.properties"

          touch "$PROPERTIES_FILE"

          grep -q '^android.useAndroidX=true$' "$PROPERTIES_FILE" \
            || echo 'android.useAndroidX=true' >> "$PROPERTIES_FILE"

          grep -q '^android.enableJetifier=true$' "$PROPERTIES_FILE" \
            || echo 'android.enableJetifier=true' >> "$PROPERTIES_FILE"

          echo "===== gradle.properties ====="
          cat "$PROPERTIES_FILE"

      # Debug APK 빌드
      - name: Build debug APK
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: gradle :app:assembleDebug --stacktrace

      # APK 생성 여부 확인
      - name: Find generated APK
        run: |
          echo "===== Generated APK ====="
          find . -type f -name "*.apk" -print

          test -f "${{ steps.project.outputs.project_dir }}/app/build/outputs/apk/debug/app-debug.apk"

      # APK Artifact 업로드
      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: WatchCollection-v1.24-debug-apk
          path: ${{ steps.project.outputs.project_dir }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
