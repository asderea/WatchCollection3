name: Build Watch Collection APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. GitHub 저장소 가져오기
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Java 17 설치
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. Android SDK 준비
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # 4. Android API 36 / Build Tools 설치
      - name: Install Android SDK 36
        run: |
          sdkmanager "platforms;android-36"
          sdkmanager "build-tools;36.0.0"

      # 5. Gradle 8.13 설치
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      # 6. 프로젝트 구조 확인
      - name: Check project files
        run: |
          echo "===== WatchCollection ====="
          ls -la WatchCollection
          echo "===== app ====="
          ls -la WatchCollection/app

      # 7. APK 빌드
      - name: Build debug APK
        working-directory: WatchCollection
        run: |
          gradle :app:assembleDebug --stacktrace

      # 8. 생성된 APK 확인
      - name: Check generated APK
        run: |
          echo "===== APK files ====="
          find WatchCollection -type f -name "*.apk" -print

      # 9. APK 다운로드용 Artifact 생성
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WatchCollection-v0.4-debug-apk
          path: WatchCollection/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
