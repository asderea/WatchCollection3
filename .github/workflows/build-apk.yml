name: Build Watch Collection APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 저장소 파일 가져오기
      - name: Checkout
        uses: actions/checkout@v6

      # Java 17 설치
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # Android SDK 설치
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      # Android API 36 설치
      - name: Install Android 16 SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      # Gradle 8.13 설치
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'

      # 프로젝트 구조 확인
      - name: Show project structure
        run: |
          echo "===== Repository root ====="
          pwd
          echo "===== Files ====="
          find . -maxdepth 3 -type f | sort

      # settings.gradle 위치를 자동 탐색
      - name: Find Gradle project
        id: find_project
        shell: bash
        run: |
          SETTINGS_FILE=$(find . -maxdepth 3 \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            | head -n 1)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "Gradle 프로젝트를 찾을 수 없습니다."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")

          echo "Gradle project found: $PROJECT_DIR"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      # APK 빌드
      - name: Build debug APK
        working-directory: ${{ steps.find_project.outputs.project_dir }}
        run: gradle :app:assembleDebug --stacktrace

      # APK 위치 확인
      - name: Find generated APK
        run: |
          echo "===== Generated APK ====="
          find . -type f -name "*.apk" -print

      # APK 업로드
      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: WatchCollection-v0.3-debug-apk
          path: |
            **/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
