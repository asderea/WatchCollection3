name: Build Watch Collection APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # 저장소 파일 가져오기
      - name: Checkout repository
        uses: actions/checkout@v6

      # Java 17 설치
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # Android SDK 설치
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      # Android API 36 설치
      - name: Install Android SDK 36
        run: |
          sdkmanager "platforms;android-36"
          sdkmanager "build-tools;36.0.0"

      # Gradle 8.13 설치
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'

      # 프로젝트 구조 확인
      - name: Check project structure
        run: |
          echo "===== Repository ====="
          ls -la

          echo "===== WatchCollection ====="
          ls -la WatchCollection

          echo "===== App ====="
          ls -la WatchCollection/app

      # APK 빌드
      - name: Build debug APK
        working-directory: WatchCollection
        run: |
          gradle :app:assembleDebug --stacktrace

      # APK 확인
      - name: Find generated APK
        run: |
          find WatchCollection -type f -name "*.apk" -print

      # APK 업로드
      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: WatchCollection-v0.6-debug-apk
          path: WatchCollection/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
